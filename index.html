<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DiviNow Quant Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .flash-up { animation: flashGreen 1s ease-out; }
    .flash-down { animation: flashRed 1s ease-out; }
    @keyframes flashGreen {
      0% { color: #4ade80; text-shadow: 0 0 10px rgba(74, 222, 128, 0.5); }
      100% { color: #4ade80; }
    }
    @keyframes flashRed {
      0% { color: #f87171; text-shadow: 0 0 10px rgba(248, 113, 113, 0.5); }
      100% { color: #f87171; }
    }
    .hide { display: none !important; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen pb-10">

  <header class="p-4 md:p-6 flex flex-col gap-4 border-b border-slate-800 sticky top-0 bg-slate-950/90 backdrop-blur z-50">
    <div class="flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-indigo-500 bg-clip-text text-transparent">
          DiviNow Quant
        </h1>
        <p class="text-slate-400 text-xs mt-1">실시간 월배당 ETF AI 시그널</p>
      </div>
      <button id="crashBtn" class="bg-red-950/50 border border-red-800 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
        Flash Crash
      </button>
    </div>
    <div id="crashBanner" class="hide bg-red-600 text-white p-3 rounded-lg flex items-center gap-2 animate-pulse text-xs font-bold">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
      <span>시장 급락 감지! 리스크 제어 모드 가동 중</span>
    </div>
  </header>

  <div class="flex overflow-x-auto no-scrollbar border-b border-slate-800 px-4 md:px-6 mt-2">
    <button class="tab-btn active px-4 py-3 text-sm font-medium border-b-2 border-blue-500 text-blue-400 whitespace-nowrap" data-target="dashboard">종합 대시보드</button>
    <button class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 whitespace-nowrap" data-target="details">상세 분석</button>
    <button class="tab-btn px-4 py-3 text-sm font-medium border-b-2 border-transparent text-slate-400 whitespace-nowrap" data-target="backtest">사후 검증(Backtest)</button>
  </div>

  <main class="p-4 md:p-6">
    <div id="dashboard" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    <div id="details" class="hide bg-slate-900 border border-slate-800 rounded-xl p-8 flex flex-col items-center justify-center min-h-[300px] text-center">
      <svg class="w-12 h-12 text-slate-600 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
      <p class="text-slate-400 text-sm">특정 ETF 선택 시 수익률 차트가 표시될 공간입니다.</p>
    </div>

    <div id="backtest" class="hide bg-slate-900 border border-slate-800 rounded-xl p-4">
      <h3 class="text-sm font-bold mb-4 text-slate-200">AI 예측 적중률 (최근 30일)</h3>
      <div class="relative h-[250px] w-full">
        <canvas id="backtestChart"></canvas>
      </div>
    </div>
  </main>

  <script>
    // --- Configuration & State ---
    const CATEGORY_LIMITS = { EQUITY: 4, BOND: 3, CC: 2, REIT: 1 };
    const MOCK_NAMES = [
      "TIGER 미국배당+7%프리미엄다우존스", "KODEX 미국배당프리미엄액티브", "ACE 미국고배당S&P", "SOL 미국배당다우존스",
      "ARIRANG 고배당주", "TIGER 리츠부동산인프라", "KODEX 200", "KBSTAR 국고채3년",
      "TIGER 단기통안채", "KODEX 종합채권(AA-이상)액티브", "ACE 미국30년국채액티브(H)", "TIGER 미국나스닥100커버드콜(합성)",
      "KODEX 배당성장", "HANARO 고배당", "SOL 미국S&P500", "ACE 글로벌배당주"
    ];

    let state = {
      universe: [],
      top10: [],
      marketCrash: false,
      intervalId: null,
      isChartInitialized: false
    };

    // --- Math Utilities ---
    const calcZScore = (value, array) => {
      if (!array || array.length === 0) return 0;
      const mean = array.reduce((a, b) => a + b, 0) / array.length;
      const variance = array.reduce((a, b) => a + Math.pow(b - mean, 2), 0) / array.length;
      const stdDev = Math.sqrt(variance);
      return stdDev === 0 ? 0 : (value - mean) / stdDev;
    };

    const getSignalStyle = (prob) => {
      if (prob >= 75) return { bg: 'bg-green-500', text: 'text-green-500', label: '강한 매수' };
      if (prob >= 56) return { bg: 'bg-green-400', text: 'text-green-400', label: '매수' };
      if (prob >= 45) return { bg: 'bg-yellow-500', text: 'text-yellow-500', label: '관망' };
      if (prob >= 26) return { bg: 'bg-red-400', text: 'text-red-400', label: '매도' };
      return { bg: 'bg-red-500', text: 'text-red-500', label: '강한 매도' };
    };

    // --- Data Initialization & Logic ---
    function initUniverse() {
      state.universe = MOCK_NAMES.map((name, idx) => {
        let category = 'EQUITY';
        if (name.includes('채')) category = 'BOND';
        if (name.includes('리츠') || name.includes('부동산')) category = 'REIT';
        if (name.includes('프리미엄') || name.includes('커버드콜')) category = 'CC';

        const basePrice = Math.floor(Math.random() * 40000) + 8000;
        return {
          id: `KR7${idx.toString().padStart(5, '0')}`,
          name, category,
          price: basePrice, prevPrice: basePrice,
          iNAV: basePrice + (Math.random() * 40 - 20),
          dividendYield: (Math.random() * 8) + 2,
          volume20d: Math.random() * 10000000,
          volatility: Math.random() * 20 + 5,
          ter: Math.random() * 0.5 + 0.05,
          probability: Math.floor(Math.random() * 100),
        };
      });
      optimizeTop10();
    }

    function optimizeTop10() {
      const yields = state.universe.map(e => e.dividendYield);
      const volumes = state.universe.map(e => e.volume20d);
      const volatilities = state.universe.map(e => e.volatility);
      const ters = state.universe.map(e => e.ter);

      const scored = state.universe.map(etf => {
        const yieldZ = calcZScore(etf.dividendYield, yields);
        const volZ = calcZScore(etf.volume20d, volumes);
        const volatilityZ = calcZScore(etf.volatility, volatilities);
        const terZ = calcZScore(etf.ter, ters);
        const totalScore = (yieldZ * 0.4) + (volZ * 0.3) - (volatilityZ * 0.2) - (terZ * 0.1);
        return { ...etf, score: totalScore };
      }).sort((a, b) => b.score - a.score);

      const result = [];
      const counts = { EQUITY: 0, BOND: 0, CC: 0, REIT: 0 };

      for (const etf of scored) {
        if (result.length >= 10) break;
        if (counts[etf.category] < CATEGORY_LIMITS[etf.category]) {
          result.push(etf);
          counts[etf.category]++;
        }
      }
      state.top10 = result;
      renderDashboard();
    }

    function updatePrices() {
      state.universe = state.universe.map(etf => {
        const changeRate = (Math.random() - 0.5) * 0.02; 
        const newPrice = Math.floor(etf.price * (1 + changeRate));
        return {
          ...etf,
          prevPrice: etf.price,
          price: newPrice,
          iNAV: newPrice + (Math.random() * 50 - 25),
          probability: state.marketCrash ? 0 : Math.floor(Math.random() * 100)
        };
      });
      optimizeTop10();
    }

    // --- DOM Rendering ---
    function renderDashboard() {
      const container = document.getElementById('dashboard');
      if (!container || container.classList.contains('hide')) return; // 불필요한 DOM 업데이트 방지

      container.innerHTML = state.top10.map(etf => {
        const disparity = ((etf.price - etf.iNAV) / etf.iNAV) * 100;
        const isDanger = Math.abs(disparity) > 0.5;
        const sig = getSignalStyle(etf.probability);
        const isUp = etf.price >= etf.prevPrice;
        const priceColor = isUp ? 'text-green-400 flash-up' : 'text-red-400 flash-down';

        return `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 shadow-lg">
            <div class="flex justify-between items-start mb-3">
              <div class="w-2/3">
                <span class="text-[10px] font-semibold px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 mb-1 inline-block">${etf.category}</span>
                <h3 class="text-sm font-bold truncate text-slate-100">${etf.name}</h3>
              </div>
              <div class="px-2 py-1 rounded text-[10px] font-bold ${sig.bg} text-slate-950">${sig.label}</div>
            </div>
            
            <div class="flex justify-between items-end mb-3">
              <div>
                <p class="text-slate-500 text-[10px]">현재가</p>
                <p class="text-lg font-mono font-semibold ${priceColor}">₩${etf.price.toLocaleString()}</p>
              </div>
              <div class="text-right">
                <p class="text-slate-500 text-[10px]">배당률(연)</p>
                <p class="text-sm font-mono font-semibold text-blue-400">${etf.dividendYield.toFixed(2)}%</p>
              </div>
            </div>

            <div class="mb-3 bg-slate-950 rounded p-1.5 flex justify-between items-center">
              <span class="text-[10px] text-slate-400">iNAV 괴리율</span>
              <span class="text-[11px] font-mono font-medium ${isDanger ? 'text-red-500' : 'text-slate-300'}">
                ${disparity > 0 ? '+' : ''}${disparity.toFixed(2)}% ${isDanger ? '⚠️' : ''}
              </span>
            </div>

            <div>
              <div class="flex justify-between text-[10px] mb-1">
                <span class="text-slate-400">AI 스코어</span>
                <span class="${sig.text} font-bold">${etf.probability}%</span>
              </div>
              <div class="h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                <div class="h-full transition-all duration-1000 ${sig.bg}" style="width: ${etf.probability}%"></div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function initChart() {
      const canvas = document.getElementById('backtestChart');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      const labels = Array.from({length: 30}, (_, i) => `${i+1}일`);
      const data = Array.from({length: 30}, (_, i) => 50 + (Math.random() * 20 + i));

      new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [{
            label: '모델 적중률 (%)',
            data: data,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59, 130, 246, 0.1)',
            borderWidth: 2,
            pointRadius: 0,
            fill: true,
            tension: 0.4
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 10 } } },
            y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8', font: { size: 10 } }, min: 0, max: 100 }
          }
        }
      });
    }

    // --- Event Listeners ---
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.remove('border-blue-500', 'text-blue-400');
          b.classList.add('border-transparent', 'text-slate-400');
        });
        e.target.classList.remove('border-transparent', 'text-slate-400');
        e.target.classList.add('border-blue-500', 'text-blue-400');

        const targetId = e.target.getAttribute('data-target');
        ['dashboard', 'details', 'backtest'].forEach(id => {
          document.getElementById(id).classList.toggle('hide', id !== targetId);
        });

        // 탭이 활성화될 때 차트 렌더링 또는 대시보드 강제 렌더링
        if (targetId === 'dashboard') {
          renderDashboard();
        } else if (targetId === 'backtest' && !state.isChartInitialized) {
          initChart();
          state.isChartInitialized = true;
        }
      });
    });

    document.getElementById('crashBtn').addEventListener('click', (e) => {
      state.marketCrash = !state.marketCrash;
      const btn = e.target;
      const banner = document.getElementById('crashBanner');
      
      if (state.marketCrash) {
        btn.textContent = '시장 복구';
        btn.className = 'bg-green-950/50 border border-green-800 text-green-400 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors';
        banner.classList.remove('hide');
        state.universe.forEach(etf => { 
          etf.prevPrice = etf.price; // Flash-down 효과를 위한 기준점 업데이트
          etf.price = Math.floor(etf.price * 0.97); 
          etf.probability = 0; 
        });
        optimizeTop10();
      } else {
        btn.textContent = 'Flash Crash';
        btn.className = 'bg-red-950/50 border border-red-800 text-red-400 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors';
        banner.classList.add('hide');
      }
    });

    // --- Bootstrapping ---
    initUniverse();
    state.intervalId = setInterval(updatePrices, 10000); // 10초 갱신

  </script>
</body>
</html>
