<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quant-Driven Dividend ETF Dashboard</title>
    <style>
        :root {
            --bg-base: #0d1117;
            --bg-panel: #161b22;
            --bg-card: #21262d;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
            --color-up: #2ea043;
            --color-down: #f85149;
            --color-hold: #58a6ff;
        }

        body { background-color: var(--bg-base); color: var(--text-main); font-family: sans-serif; padding: 20px; }
        
        header { margin-bottom: 20px; border-bottom: 1px solid var(--bg-card); padding-bottom: 20px; }
        .tab-container { display: flex; gap: 10px; margin-top: 15px; }
        .tab-btn { padding: 8px 16px; background: var(--bg-card); border: 1px solid #30363d; color: var(--text-muted); cursor: pointer; border-radius: 6px; }
        .tab-btn.active { background: var(--color-hold); color: white; border-color: var(--color-hold); }

        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background-color: var(--bg-panel); border: 1px solid var(--bg-card); border-radius: 8px; padding: 15px; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
        .name { font-size: 1rem; font-weight: bold; }
        .ticker { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }
        
        .signal-badge { padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .signal-strong-buy { border: 1px solid var(--color-up); color: var(--color-up); }
        .signal-hold { border: 1px solid var(--color-hold); color: var(--color-hold); }
        
        .progress-bg { background-color: var(--bg-base); height: 6px; border-radius: 3px; overflow: hidden; margin: 5px 0 10px; }
        .progress-fill { height: 100%; }
        .fill-buy { background-color: var(--color-up); }
        .fill-sell { background-color: var(--color-down); }
        .up { color: var(--color-up); } .down { color: var(--color-down); }
    </style>
</head>
<body>

    <header>
        <h1>Dividend ETF Quant Dashboard</h1>
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('domestic')">국내 ETF</button>
            <button class="tab-btn" onclick="switchTab('international')">해외 ETF</button>
        </div>
    </header>

    <main id="dashboard" class="grid-container"></main>

    <script>
        const ETFData = {
            domestic: [
                { name: 'TIGER 리츠부동산', ticker: '329200', base: 4500 }, { name: 'KODEX 고배당', ticker: '102110', base: 12000 },
                { name: 'KBSTAR 배당귀족', ticker: '292370', base: 11000 }, { name: 'ARIRANG 고배당주', ticker: '161510', base: 13000 },
                { name: 'KOSEF 고배당', ticker: '200250', base: 10500 }, { name: 'TIGER 미국배당다우존스', ticker: '458730', base: 12000 },
                { name: 'ACE 미국배당다우존스', ticker: '449180', base: 11500 }, { name: 'SOL 미국배당다우존스', ticker: '448510', base: 11200 },
                { name: 'KODEX 미국배당프리미엄', ticker: '458900', base: 10800 }, { name: 'HANARO 고배당', ticker: '290270', base: 9500 },
                { name: 'TIGER 글로벌멀티에셋', ticker: '332930', base: 9800 }, { name: 'KODEX 배당성장', ticker: '213610', base: 14000 },
                { name: 'KBSTAR 고배당', ticker: '148070', base: 8900 }, { name: 'ACE 고배당', ticker: '292750', base: 9200 },
                { name: 'SOL 고배당', ticker: '433330', base: 9100 }, { name: 'TIGER 배당성장', ticker: '211270', base: 15000 },
                { name: 'KODEX 배당가치', ticker: '264660', base: 10200 }, { name: 'KBSTAR 미국배당다우존스', ticker: '458740', base: 11300 },
                { name: 'ACE 미국배당30', ticker: '464920', base: 10500 }, { name: 'TIGER 미국배당+7%프리미엄', ticker: '476680', base: 10100 }
            ],
            international: [
                { name: 'JPMorgan Equity Premium', ticker: 'JEPI', base: 55 }, { name: 'JPMorgan Nasdaq Equity', ticker: 'JEPQ', base: 50 },
                { name: 'Schwab US Dividend', ticker: 'SCHD', base: 85 }, { name: 'Vanguard Dividend App', ticker: 'VIG', base: 180 },
                { name: 'Vanguard High Dividend', ticker: 'VYM', base: 120 }, { name: 'Global X SuperDividend', ticker: 'SDIV', base: 15 },
                { name: 'Invesco Dividend Achievers', ticker: 'PFM', base: 35 }, { name: 'ProShares S&P 500 Dividend', ticker: 'NOBL', base: 95 },
                { name: 'First Trust Value Line', ticker: 'FVD', base: 40 }, { name: 'WisdomTree US High Div', ticker: 'DHS', base: 80 },
                { name: 'iShares Select Dividend', ticker: 'DVY', base: 115 }, { name: 'SPDR Portfolio S&P 500 High', ticker: 'SPYD', base: 42 },
                { name: 'Global X Nasdaq Covered', ticker: 'QYLD', base: 17 }, { name: 'Global X Russell 2000 Covered', ticker: 'RYLD', base: 16 },
                { name: 'Global X S&P 500 Covered', ticker: 'XYLD', base: 39 }, { name: 'PIMCO Income Strategy', ticker: 'PFL', base: 12 },
                { name: 'Realty Income Corp', ticker: 'O', base: 52 }, { name: 'Main Street Capital', ticker: 'MAIN', base: 44 },
                { name: 'AGNC Investment Corp', ticker: 'AGNC', base: 10 }, { name: 'Prospect Capital Corp', ticker: 'PSEC', base: 6 }
            ]
        };

        let currentTab = 'domestic';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(tab === 'domestic' ? '국내' : '해외'));
            });
            render();
        }

        function render() {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = '';
            ETFData[currentTab].forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">
                        <div>
                            <div class="name">${item.name}</div>
                            <div class="ticker">${item.ticker}</div>
                        </div>
                        <div style="text-align:right">
                            <div style="font-weight:bold">$${item.base}</div>
                            <div class="up">+1.2%</div>
                        </div>
                    </div>
                    <div class="signal-badge signal-strong-buy">STRONG BUY</div>
                    <div class="progress-bg"><div class="progress-fill fill-buy" style="width: 85%"></div></div>
                `;
                dashboard.appendChild(card);
            });
        }

        window.onload = render;
    </script>
</body>
</html>
