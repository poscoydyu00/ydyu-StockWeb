<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>월배당 ETF 매매 대시보드 (Real-Time Live)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --border: #334155;
            --flash-green: rgba(34, 197, 94, 0.3);
            --flash-red: rgba(239, 68, 68, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-color); display: flex; height: 100vh; overflow: hidden; }

        aside { width: 320px; background-color: var(--card-bg); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; flex-shrink: 0; z-index: 10; }
        h1 { font-size: 1.2rem; color: var(--primary); font-weight: 700; margin-bottom: 5px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        label { font-size: 0.85rem; color: var(--text-muted); }
        select, input[type="range"] { width: 100%; padding: 12px; background: var(--bg-color); border: 1px solid var(--border); color: var(--text-color); border-radius: 8px; font-size: 1rem; }
        
        main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        
        nav { display: flex; background: var(--card-bg); border-bottom: 1px solid var(--border); overflow-x: auto; white-space: nowrap; -webkit-overflow-scrolling: touch; }
        nav::-webkit-scrollbar { display: none; }
        .tab-btn { padding: 15px 20px; border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 0.95rem; font-weight: 600; transition: all 0.2s; }
        .tab-btn.active { color: var(--primary); border-bottom: 3px solid var(--primary); background: rgba(56, 189, 248, 0.05); }

        .tab-content { flex: 1; overflow-y: auto; display: none; padding: 20px; -webkit-overflow-scrolling: touch; }
        .tab-content.active { display: flex; flex-direction: column; gap: 20px; }

        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; }

        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 18px; position: relative; }
        .card-title { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 12px; font-weight: 600; line-height: 1.4; display: flex; justify-content: space-between; }
        .card-value { font-size: 1.6rem; font-weight: 700; }
