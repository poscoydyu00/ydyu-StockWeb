<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DiviNow - 월배당 ETF 실시간 분석기</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
body {
-webkit-tap-highlight-color: transparent;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* 실시간 가격 변동 시각 피드백 애니메이션 */
@keyframes flash-green { 0% { background-color: rgba(34, 197, 94, 0.35); } 100% { background-color: transparent; } }
@keyframes flash-red { 0% { background-color: rgba(239, 68, 68, 0.35); } 100% { background-color: transparent; } }
.flash-up { animation: flash-green 0.8s ease-out; }
.flash-down { animation: flash-red 0.8s ease-out; }
</style>
</head>
<body class="bg-gray-950 text-gray-105 min-h-screen pb-24 text-gray-100">

<header class="sticky top-0 z-50 bg-gray-900/90 backdrop-blur-md border-b border-gray-800 px-4 py-3">
<div class="flex justify-between items-center max-w-md mx-auto">
<div class="flex items-center gap-2">
<i data-lucide="trending-up" class="text-emerald-500 w-6 h-6"></i>
<h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">DiviNow</h1>
</div>
<button id="btn-simulation" class="text-xs bg-red-950/40 border border-red-800 text-red-400 px-2.5 py-1.5 rounded-full font-medium flex items-center gap-1 active:scale-95 transition-transform">
<i data-lucide="zap" class="w-3.5 h-3.5"></i> 시장 폭락 시뮬레이션
</button>
</div>
<div id="risk-banner" class="hidden max-w-md mx-auto mt-2 bg-red-500/20 border border-red-500/40 text-red-300 text-[11px] py-2 px-3 rounded-lg flex items-center gap-2">
<i data-lucide="alert-triangle" class="w-4 h-4 text-red-400 shrink-0 animate-pulse"></i>
<span><strong>[경고]</strong> 시장 급변동(Flash Crash) 감지. 시스템 리스크 제어 모드 가동 중. 매수 보류 권장.</span>
</div>
</header>

<main class="max-w-md mx-auto px-4 mt-4">

<section id="tab-dashboard" class="tab-content active space-y-4">
<div class="flex justify-between items-center">
<h2 class="text-sm font-semibold text-gray-400 flex items-center gap-1.5">
<i data-lucide="award" class="w-4 h-4 text-amber-500"></i> AI 추천 월배당 TOP 10
</h2>
<span id="sync-indicator" class="text-[10px] text-gray-500 flex items-center gap-1">
<span class="w-1.5 h-1.5 bg-emerald-500 rounded-full animate-ping"></span> 실시간 연산 중 (10s)
</span>
</div>
<div id="etf-list-container" class="space-y-3"></div>
</section>

<section id="tab-backtest" class="tab-content space-y-4">
<h2 class="text-base font-bold text-gray-200">AI 모델 사후 검증 (Backtest)</h2>
<div class="bg-gray-900 border border-gray-800 rounded-xl p-4 space-y-3">
<div class="flex justify-between items-center border-b border-gray-800 pb-2">
<span class="text-sm text-gray-400">최근 30거래일 평균 적중률</span>
<span class="text-xl font-bold text-emerald-400">78.4%</span>
</div>
<p class="text-xs text-gray-500 leading-relaxed">
매수 확률 75% 이상 제시 후 3거래일 이내 실제 상승/배당락 방어에 성공한 확률입니다. 장 마감 후 마스터 피드백 엔진에 의해 가중치가 자동 튜닝됩니다.
</p>
</div>
<div class="bg-gray-900 border border-gray-800 rounded-xl p-4">
<span class="text-xs font-semibold text-gray-400 block mb-3">일자별 신호 적중률 추이</span>
<div class="flex items-end justify-between h-28 pt-4 px-2 border-b border-gray-800">
<div class="flex flex-col items-center gap-1 w-8"><div class="bg-emerald-600/40 w-full rounded-t" style="height: 72%"></div><span class="text-[9px] text-gray-500">05.22</span></div>
<div class="flex flex-col items-center gap-1 w-8"><div class="bg-emerald-600/40 w-full rounded-t" style="height: 75%"></div><span class="text-[9px] text-gray-500">05.23</span></div>
<div class="flex flex-col items-center gap-1 w-8"><div class="bg-emerald-600/40 w-full rounded-t" style="height: 81%"></div><span class="text-[9px] text-gray-500">05.24</span></div>
<div class="flex flex-col items-center gap-1 w-8"><div class="bg-emerald-600/40 w-full rounded-t" style="height: 69%"></div><span class="text-[9px] text-gray-500">05.25</span></div>
<div class="flex flex-col items-center gap-1 w-8"><div class="bg-emerald-500 w-full rounded-t shadow-[0_0_10px_rgba(16,185,129,0.2)]" style="height: 78%"></div><span class="text-[9px] text-emerald-400 font-medium">오늘</span></div>
</div>
</div>
</section>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-gray-900/95 backdrop-blur-md border-t border-gray-800 pb-[env(safe-area-inset-bottom)]">
<div class="flex justify-around items-center h-16 max-w-md mx-auto px-6">
<button onclick="switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center gap-1 text-emerald-500">
<i data-lucide="layout-dashboard" class="w-5 h-5"></i>
<span class="text-[11px] font-medium">추천 보드</span>
</button>
<button onclick="switchTab('backtest')" id="nav-backtest" class="flex flex-col items-center gap-1 text-gray-500">
<i data-lucide="line-chart" class="w-5 h-5"></i>
<span class="text-[11px] font-medium">AI 성과검증</span>
</button>
</div>
</nav>

<script>
// 가상 월배당 ETF 기초 데이터 유니버스
const etfUniverse = [
{ code: "465320", name: "TIGER 미국배당다우존스", type: "주식형", basePrice: 11200, dps: 95, beta: 0.85, fee: 0.01 },
{ code: "453250", name: "KODEX 미국반도체고배당플러스", type: "주식형", basePrice: 13400, dps: 110, beta: 1.25, fee: 0.05 },
{ code: "475630", name: "ACE 미국30년국채액티브(H)", type: "채권형", basePrice: 9150, dps: 52, beta: 0.32, fee: 0.02 },
{ code: "469230", name: "SOL 미국30년국채커버드콜(합성)", type: "커버드콜형", basePrice: 8740, dps: 104, beta: 0.45, fee: 0.06 },
{ code: "432100", name: "TIGER 미국테크TOP10+10%프리미엄", type: "커버드콜형", basePrice: 12100, dps: 125, beta: 1.10, fee: 0.07 },
{ code: "482930", name: "KODEX 한국부동산리츠고배당", type: "리츠형", basePrice: 4950, dps: 35, beta: 0.25, fee: 0.08 },
{ code: "456780", name: "RISE 글로벌주식배당성장", type: "주식형", basePrice: 10800, dps: 70, beta: 0.78, fee: 0.03 },
{ code: "491200", name: "PLUS 고배당주액티브", type: "주식형", basePrice: 14200, dps: 115, beta: 0.90, fee: 0.04 },
{ code: "472310", name: "ACE 국내단기채권TR", type: "채권형", basePrice: 50450, dps: 210, beta: 0.05, fee: 0.01 },
{ code: "461230", name: "TIGER 가치배당소형주", type: "주식형", basePrice: 9600, dps: 65, beta: 0.95, fee: 0.05 },
{ code: "489100", name: "SOL 글로벌리츠인프라", type: "리츠형", basePrice: 6200, dps: 48, beta: 0.35, fee: 0.06 },
{ code: "479000", name: "KODEX 국고채30년액티브", type: "채권형", basePrice: 9800, dps: 40, beta: 0.40, fee: 0.02 }
 ];

let isEmergency = false;
let prevPrices = {};

// 핵심 로직 연산 함수
function processEtfData() {
let processed = etfUniverse.map(etf => {
const changePercent = isEmergency ? (Math.random() * -3.5 - 1.5) : (Math.random() * 0.8 - 0.4);
const currentPrice = Math.round(etf.basePrice * (1 + changePercent / 100));

const inavNoise = isEmergency ? (Math.random() * 0.8 - 0.2) : (Math.random() * 0.3 - 0.15);
const iNAV = currentPrice * (1 + inavNoise / 100);
const disparity = ((currentPrice - iNAV) / iNAV) * 100;

const annualYield = ((etf.dps * 12) / currentPrice) * 100;
const score = (annualYield * 4) + ((2 - etf.beta) * 3) + ((0.1 - etf.fee) * 30);

let buyProbability = 50 + (annualYield * 2) - (disparity * 5);
if (etf.beta > 1.1) buyProbability -= 5;
if (isEmergency) buyProbability = 0;
buyProbability = Math.max(5, Math.min(99, Math.round(buyProbability)));

return { ...etf, currentPrice, disparity, annualYield, score, buyProbability };
});

processed.sort((a, b) => b.score - a.score);
const counts = { 주식형: 0, 채권형: 0, 커버드콜형: 0, 리츠형: 0 };
const recommendedTop10 = [];

for (const etf of processed) {
if (recommendedTop10.length >= 10) break;

let limit = 0;
if (etf.type === "주식형") limit = 4;
else if (etf.type === "채권형") limit = 3;
else if (etf.type === "커버드콜형") limit = 2;
else if (etf.type === "리츠형") limit = 1;

if (counts[etf.type] < limit) {
recommendedTop10.push(etf);
counts[etf.type]++;
}
}
return recommendedTop10;
}

// 화면 UI 갱신 함수
function renderDashboard() {
const container = document.getElementById("etf-list-container");
if (!container) return;

const data = processEtfData();
container.innerHTML = "";

data.forEach((etf) => {
let signalColor = "bg-gray-500";
let signalText = "관망";
let textColor = "text-yellow-500";
let descText = "단기 변동성 확대로 관망 권장";

if (etf.buyProbability >= 75) {
signalColor = "bg-emerald-500";
signalText = "강한 매수";
textColor = "text-emerald-400";
descText = "현재 가격 진입 매력도 및 배당 안전성 높음";
} else if (etf.buyProbability <= 35) {
signalColor = "bg-red-500";
signalText = "매도/보류";
textColor = "text-red-400";
descText = "단기 과열 또는 자본 소실 위험 감지";
}

// 애니메이션 리플로우 버그 수정: 이전 클래스 초기화 유도
let flashClass = "";
if (prevPrices[etf.code]) {
if (etf.currentPrice > prevPrices[etf.code]) flashClass = "flash-up";
else if (etf.currentPrice < prevPrices[etf.code]) flashClass = "flash-down";
}
prevPrices[etf.code] = etf.currentPrice;

const card = document.createElement("div");
card.className = bg-gray-900 border border-gray-800 rounded-xl p-4 transition-all duration-300 ${flashClass}; card.innerHTML =
<div class="flex justify-between items-start">
<div>
<div class="flex items-center gap-1.5 mb-1">
<span class="text-[10px] bg-gray-800 text-gray-400 px-1.5 py-0.5 rounded font-medium">${etf.type}&lt;/span&gt; &lt;span class="text-[11px] text-gray-500 font-mono"&gt;${etf.code}</span>
</div>
<h3 class="font-bold text-sm text-gray-200">${etf.name}&lt;/h3&gt; &lt;/div&gt; &lt;div class="flex items-center gap-1.5"&gt; &lt;span class="w-2 h-2 rounded-full ${signalColor}"></span>
<span class="text-xs font-bold ${textColor}"&gt;${signalText}</span>
</div>
</div>

<div class="grid grid-cols-3 gap-2 my-3 text-center bg-gray-950 p-2 rounded-lg border border-gray-800/60">
<div>
<span class="text-[10px] text-gray-500 block">실시간 현재가</span>
<span class="text-xs font-bold font-mono text-gray-300">${etf.currentPrice.toLocaleString()}원&lt;/span&gt; &lt;/div&gt; &lt;div&gt; &lt;span class="text-[10px] text-gray-500 block"&gt;iNAV 괴리율&lt;/span&gt; &lt;span class="text-xs font-bold font-mono ${Math.abs(etf.disparity) > 0.5 ? 'text-rose-400' : 'text-gray-400'}">
${etf.disparity &gt; 0 ? '+' : ''}${etf.disparity.toFixed(2)}%
</span>
</div>
<div>
<span class="text-[10px] text-gray-500 block">연배당수익률</span>
<span class="text-xs font-bold font-mono text-amber-400">`${etf.annualYield.toFixed(2)}%</span>
</div>
</div>

<div class="space-y-1">
<div class="flex justify-between text-[10px] font-medium">
<span class="text-gray-500">AI 모델 분석 기반 진입 성공 승률</span>
<span class="{etf.buyProbability}%</span>
</div>
<div class="w-full bg-gray-800 h-1.5 rounded-full overflow-hidden">
<div class="{etf.buyProbability}%"></div>
</div>
<span class="text-[10px] text-gray-500 block pt-0.5"><i data-lucide="info" class="w-2.5 h-2.5 inline mr-0.5 mb-0.5"></i>${descText}&lt;/span&gt; &lt;/div&gt;;
container.appendChild(card);
});
lucide.createIcons();
}

// 탭 토글 엔진
function switchTab(tabId) {
document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
document.getElementById(tab-${tabId}`).classList.add('active');

document.querySelectorAll('nav button').forEach(el => {
el.classList.remove('text-emerald-500');
el.classList.add('text-gray-500');
});
document.getElementById(nav-${tabId}).classList.remove('text-gray-500'); document.getElementById(nav-${tabId}).classList.add('text-emerald-500');

if(tabId === 'dashboard') renderDashboard();
}

// 시뮬레이터 인터랙션 이벤트 바인딩
document.getElementById("btn-simulation").addEventListener("click", () => {
isEmergency = !isEmergency;
const banner = document.getElementById("risk-banner");
const btn = document.getElementById("btn-simulation");

if (isEmergency) {
banner.classList.remove("hidden");
btn.innerHTML = <i data-lucide="refresh-cw" class="w-3.5 h-3.5 animate-spin"&gt;&lt;/i&gt; 복구하기;
btn.className = "text-xs bg-emerald-950/40 border border-emerald-800 text-emerald-400 px-2.5 py-1.5 rounded-full font-medium flex items-center gap-1 active:scale-95 transition-transform";
} else {
banner.classList.add("hidden");
btn.innerHTML = <i data-lucide="zap" class="w-3.5 h-3.5"&gt;&lt;/i&gt; 시장 폭락 시뮬레이션;
btn.className = "text-xs bg-red-950/40 border border-red-800 text-red-400 px-2.5 py-1.5 rounded-full font-medium flex items-center gap-1 active:scale-95 transition-transform";
}
lucide.createIcons();
renderDashboard();
});

// DOM 최초 로드 동기화 구동
document.addEventListener("DOMContentLoaded", () => {
lucide.createIcons();
renderDashboard();
setInterval(renderDashboard, 10000); // 10초 주기 리프레시 엔진 작동
});
</script>
</body>
</html>
